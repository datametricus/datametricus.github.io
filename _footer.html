<script>
  function buildVoiceAssistantUrl(options = {}) {
    const voiceUrl = new URL('/ai-agent/frontend/index.html', window.location.origin);
    voiceUrl.searchParams.set('mode', 'browser');
    if (options.embed) voiceUrl.searchParams.set('embed', '1');
    if (options.autostart) voiceUrl.searchParams.set('autostart', '1');
    return voiceUrl.toString();
  }

  function openVoiceAssistant() {
    if (window.location.pathname.endsWith('/index.html') || window.location.pathname === '/' || window.location.pathname === '/index') {
      if (typeof toggleHomepageAssistant === 'function') {
        toggleHomepageAssistant(true);
        return;
      }
    }
    window.open(buildVoiceAssistantUrl(), '_blank', 'noopener');
  }
</script>
